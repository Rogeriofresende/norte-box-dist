<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITULO}}</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #262b36;
    --fg: #e6e8ec;
    --muted: #9aa2b1;
    --accent: #7ee787;
    --code-bg: #10141b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    padding: 2.5rem 1rem;
  }
  .wrap {
    max-width: 760px;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 2rem 2.25rem;
  }
  header.doc-head {
    border-bottom: 1px solid var(--border);
    padding-bottom: 1rem;
    margin-bottom: 1.5rem;
  }
  header.doc-head h1 {
    font-size: 1.55rem;
    line-height: 1.25;
    margin: 0 0 .35rem;
  }
  header.doc-head .meta {
    color: var(--muted);
    font-size: .85rem;
  }
  h1, h2, h3, h4 { line-height: 1.3; }
  h2 { font-size: 1.25rem; margin: 1.8rem 0 .6rem; }
  h3 { font-size: 1.05rem; margin: 1.4rem 0 .5rem; }
  a { color: var(--accent); }
  p { margin: .7rem 0; }
  ul, ol { padding-left: 1.4rem; }
  li { margin: .3rem 0; }
  code {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: .1rem .35rem;
    font: .9em/1.4 "SFMono-Regular", Menlo, Consolas, monospace;
  }
  pre {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
    overflow-x: auto;
  }
  pre code { background: none; border: none; padding: 0; }
  blockquote {
    border-left: 3px solid var(--accent);
    margin: 1rem 0;
    padding: .2rem 1rem;
    color: var(--muted);
  }
  table {
    border-collapse: collapse;
    width: 100%;
    margin: 1rem 0;
    font-size: .95rem;
  }
  th, td {
    border: 1px solid var(--border);
    padding: .5rem .7rem;
    text-align: left;
  }
  th { background: var(--code-bg); }
  hr { border: none; border-top: 1px solid var(--border); margin: 1.5rem 0; }
  footer.doc-foot {
    border-top: 1px solid var(--border);
    margin-top: 2rem;
    padding-top: 1rem;
    color: var(--muted);
    font-size: .8rem;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="doc-head">
      <h1>{{TITULO}}</h1>
      <div class="meta">{{META}}</div>
    </header>
    <main>
{{CORPO_HTML}}
    </main>
    <footer class="doc-foot">Gerado localmente pelo Norte-box &middot; arquivo auto-contido, sem rede.</footer>
  </div>
</body>
</html>
